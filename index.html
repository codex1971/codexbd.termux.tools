<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex BD Termux Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="main-wrapper">
        <header>
            <h1 class="glitch" data-text="Codex BD Termux Tool">Codex BD Termux Tool</h1>
            <div class="stats-panel">
                <span>[ STATUS: <b class="blink">ENCRYPTED</b> ]</span>
                <span>[ LOADED_TOOLS: <b id="tool-counter">0</b> ]</span>
            </div>
            <input type="text" id="searchBar" placeholder="[ SEARCH TOOL NAME... ]">
        </header>

        <div id="tools-container" class="grid-layout"></div>
    </div>

    <footer>
        <p>POWERED BY CODEX BD | SECURED INTERFACE</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
